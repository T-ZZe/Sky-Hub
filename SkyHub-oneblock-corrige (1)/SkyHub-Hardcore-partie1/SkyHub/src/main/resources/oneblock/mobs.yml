# Apparition de mobs liée à la casse du OneBlock (jamais d'apparition naturelle dans le monde des îles).
settings:
  max-mobs-per-island: 12     # mobs issus du OneBlock vivants simultanément par île
  spawn-cooldown-ms: 1500     # délai minimal entre deux événements de mobs sur une même île
  spawn-radius: 3             # rayon de recherche d'une position libre autour du OneBlock
  surprise-wave-size: "2-4"   # nombre de mobs d'un événement SURPRISE
  difficulty: NORMAL
difficulties:
  EASY: { health-multiplier: 0.75, damage-multiplier: 0.75 }
  NORMAL: { health-multiplier: 1.0, damage-multiplier: 1.0 }
  HARD: { health-multiplier: 1.5, damage-multiplier: 1.25 }
# Par phase : NONE (rien), SURPRISE (vague de mobs 'wave'), ou un EntityType. Poids = pourcentages (normalisés).
