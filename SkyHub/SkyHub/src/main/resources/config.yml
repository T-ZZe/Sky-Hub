# ==============================
#  SkyHub - configuration
# ==============================

lobby:
  # Nom du monde void créé automatiquement
  world-name: hub
  # Hauteur de la surface de l'île (le dessus de l'herbe)
  island-y: 100
  # Rayon de l'île
  radius: 14
  # Point d'apparition (yaw 180 = regarde vers le nord, vers les PNJ)
  spawn:
    x: 0.5
    y: 101
    z: 0.5
    yaw: 180
    pitch: 0
  # Mode de jeu appliqué dans le hub (ignoré pour la permission skyhub.build)
  gamemode: ADVENTURE
  # Téléporter au hub à chaque connexion
  teleport-on-join: true
  # Respawn dans le hub après une mort
  teleport-on-respawn: false
  # Si un joueur tombe sous cette hauteur, il est ramené au spawn
  void-teleport-below: 70

# Les 3 PNJ. "world" = nom du monde de destination.
# "world" est le monde normal par défaut du serveur.
# Si le monde existe dans le dossier du serveur mais n'est pas chargé, il sera chargé automatiquement.
npcs:
  hardcore:
    name: "<dark_red><bold>Hardcore"
    profession: weaponsmith
    world: world
    gamemode: SURVIVAL
    location: {x: -6.5, y: 101, z: -6.5, yaw: 0, pitch: 0}
  event:
    name: "<gold><bold>Event"
    profession: librarian
    world: event
    gamemode: SURVIVAL
    location: {x: 0.5, y: 101, z: -6.5, yaw: 0, pitch: 0}
  ffa:
    name: "<red><bold>FFA"
    profession: armorer
    world: ffa
    gamemode: SURVIVAL
    location: {x: 7.5, y: 101, z: -6.5, yaw: 0, pitch: 0}

# Messages (format MiniMessage)
messages:
  teleporting: "<green>Téléportation vers %name%<green>..."
  world-missing: "<red>Le monde <white>%world%</white> n'existe pas ou n'a pas pu être chargé."
  hub-teleport: "<aqua>Retour au hub !"
  reloaded: "<green>Configuration rechargée."
  players-only: "<red>Cette commande est réservée aux joueurs."
