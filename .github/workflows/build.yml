name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: SkyHub/pom.xml
      - name: Build
        run: mvn -B package
        working-directory: SkyHub
      - uses: actions/upload-artifact@v4
        with:
          name: SkyHub
          path: SkyHub/target/SkyHub-*.jar
