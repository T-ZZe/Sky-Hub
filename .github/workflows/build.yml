name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          POM=$(find . -name pom.xml -not -path '*/target/*' | head -n 1)
          echo "pom.xml trouvé : $POM"
          mvn -B package -f "$POM"
      - uses: actions/upload-artifact@v4
        with:
          name: SkyHub
          path: "**/target/SkyHub-*.jar"
