# ==============================
#  SkyHub - configuration
# ==============================

lobby:
  # Nom du monde void créé automatiquement
  world-name: hub
  # Hauteur de la surface de l'île (le dessus de l'herbe)
  island-y: 100
  # Rayon de l'île
  radius: 14
  # Point d'apparition (yaw 180 = regarde vers le nord)
  spawn:
    x: 0.5
    y: 101
    z: 0.5
    yaw: 180
    pitch: 0
  # Mode de jeu appliqué dans le hub (ignoré pour la permission skyhub.build)
  gamemode: ADVENTURE
  teleport-on-join: true
  teleport-on-respawn: false
  # Sauvegarde la position du joueur quand il quitte un monde pour le hub,
  # et le remet au même endroit quand il revient via le mob
  save-positions: true
  # Un joueur qui tombe plus bas que (island-y - cette valeur) est ramené au spawn
  void-teleport-depth: 5
  # Sphère noire autour de l'île
  sphere:
    enabled: true
    radius: 24
    thickness: 2
    # Le centre de la sphère est à island-y + cette valeur
    center-offset-y: 10
    material: BLACK_CONCRETE
    # Blocs de lumière invisibles pour y voir quelque chose (false = noir total)
    lighting: true

# Inventaire + XP séparés par monde (le nether/end d'un monde partagent le sien)
inventories:
  separate: true

# Gamerules indépendantes par monde : /gamerule ne change que le monde où tu es
gamerules:
  per-world: true

# Zones protégées (/claim)
claims:
  max-volume: 2000000     # taille max d'une zone (en blocs)
  blocks-per-tick: 10000  # blocs traités par tick pendant une sauvegarde / reconstruction (baisse si ça lag)

# Monde FFA
ffa:
  item-despawn-seconds: 180   # objet au sol plus de X secondes = il disparaît (0 = désactivé)

# Kits du FFA
kits:
  give-on-respawn: true   # rééquipe le dernier kit utilisé dans la zone au respawn

# Module Hardcore : mort = ban, sanctions, blacklist (/hardcore, /unban)
# Tout ne fonctionne que dans ce monde (world_nether et world_the_end inclus).
# Mets ici le même monde que npcs.hardcore.world
hardcore:
  world: world
  # Durée du ban à la mort, en heures (120 = 5 jours réels). Modifiable en jeu via /hardcore
  ban-hours: 120
  # Première arrivée dans le monde hardcore : spawn aléatoire dans ce rayon (en blocs) autour du spawn du monde
  spawn-radius: 250

# Les 3 mobs de téléportation.
# "entity" = type du mob, "world" = monde de destination.
# Pose / déplace un mob avec : /l sp <hardcore|oneblock|ffa>
npcs:
  hardcore:
    name: "<dark_red><bold>Hardcore"
    entity: WITHER_SKELETON
    scale: 2              # taille du mob (1 = normale)
    glow-color: dark_red # couleur du glowing (dark_red, red, blue, gold, green, aqua, ...)
    title-enabled: true   # gros titre flottant au-dessus du mob
    title: "<dark_red><bold>HARDCORE"
    title-scale: 4.0
    clear-equipment: true   # supprime l'épée du wither squelette
    world: world
    gamemode: SURVIVAL
    location: {x: -6.5, y: 101, z: -6.5, yaw: 0, pitch: 0}
  oneblock:
    name: "<green><bold>One Block"
    entity: IRON_GOLEM
    scale: 2              # taille du mob (1 = normale)
    glow-color: green     # couleur du glowing (red, blue, gold, green, aqua, ...)
    title-enabled: true   # gros titre flottant au-dessus du mob
    title: "<green><bold>ONE BLOCK"
    title-scale: 4.0
    clear-equipment: true
    world: oneblock_world # (monde défini dans oneblock/islands.yml) : le mob envoie sur l'île du joueur
    gamemode: SURVIVAL
    location: {x: 0.5, y: 101, z: -6.5, yaw: 0, pitch: 0}
  ffa:
    name: "<red><bold>FFA"
    entity: BREEZE
    scale: 2              # taille du mob (1 = normale)
    glow-color: gold      # couleur du glowing (red, blue, gold, green, aqua, ...)
    title-enabled: true   # gros titre flottant au-dessus du mob
    title: "<gold><bold>FFA"
    title-scale: 4.0
    clear-equipment: true
    world: ffa
    gamemode: SURVIVAL
    location: {x: 7.5, y: 101, z: -6.5, yaw: 0, pitch: 0}

# Messages (format MiniMessage)
messages:
  teleporting: "<green>Téléportation vers %name%<green>..."
  world-missing: "<red>Le monde <white>%world%</white> n'existe pas ou n'a pas pu être chargé."
  hub-teleport: "<aqua>Retour au hub !"
  reloaded: "<green>Configuration rechargée."
  players-only: "<red>Cette commande est réservée aux joueurs."
  no-permission: "<red>Tu n'as pas la permission."
  npc-unknown: "<red>Mob inconnu. Choix : <white>%ids%"
  not-in-hub: "<red>Tu dois être dans le hub pour poser un mob."
  npc-placed: "<green>%name%<green> posé ici. L'ancien a été supprimé."
  usage-sp: "<yellow>Usage : /l sp [nom]  (%ids%)"
  usage: "<yellow>/l sp <nom> | /l open <ffa|monde> | /l close [monde|all] | /l reload"
  world-bad-name: "<red>Nom de monde invalide (lettres, chiffres, _ et - uniquement)."
  world-opening: "<yellow>Ouverture du monde <white>%name%</white>..."
  world-opened: "<green>Le monde <white>%name%</white> est ouvert (flat)."
  world-open-failed: "<red>Impossible d'ouvrir le monde <white>%name%</white>."
  world-already-open: "<red>Le monde <white>%name%</white> est déjà ouvert."
  world-not-open: "<red>Le monde <white>%name%</white> n'est pas ouvert."
  world-none-open: "<red>Aucun monde ouvert avec /l open."
  world-protected: "<red>Le monde <white>%name%</white> ne peut pas être fermé."
  world-closing-kick: "<red>Le monde <white>%name%</white> ferme, retour au hub !"
  world-closed-done: "<green>Le monde <white>%name%</white> est fermé."
  world-close-failed: "<red>Impossible de fermer le monde <white>%name%</white>."
  world-closed: "<red>%name%<red> est actuellement fermé."
